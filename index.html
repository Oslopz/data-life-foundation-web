<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundación Data Life</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #0284c7;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Encabezado */
    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 0;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: var(--primary-dark);
      text-decoration: none;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 500;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--primary);
    }

    section {
      padding: 44px 0;
    }

    .card-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 34px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
    }

    .section-title {
      font-size: 1.7rem;
      margin-bottom: 10px;
      color: var(--text);
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      max-width: 72ch;
    }

    /* Hero */
    .hero {
      padding-top: 40px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 2.85rem);
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.08rem;
      color: var(--muted);
      max-width: 74ch;
      margin-bottom: 24px;
    }

    .actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.2s ease;
      background: var(--surface);
      color: var(--text);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
    }

    .btn-secondary {
      background-color: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover,
    .btn-secondary.active {
      border-color: var(--primary);
      background-color: #f0fdfa;
      color: var(--primary-dark);
    }

    /* Home: Quiénes somos / Cómo funcionamos / Por qué confiar */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .pillar-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }

    .pillar-card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    .pillar-card p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .step-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .step-num {
      display: inline-flex;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .step-card h3 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .step-card p {
      font-size: 0.92rem;
      color: var(--muted);
    }

    /* Controles de Proyectos */
    .catalog-controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
      padding: 18px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .filter-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .filter-group select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
    }

    /* Tarjetas de Proyecto */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
    }

    .project-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-card img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      display: block;
      background-color: #e2e8f0;
    }

    .project-content {
      padding: 18px;
    }

    .project-title {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .project-meta {
      list-style: none;
      font-size: 0.92rem;
      color: var(--muted);
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }

    .project-meta strong {
      color: var(--text);
    }

    .project-footer {
      padding: 0 18px 18px;
    }

    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      background: var(--surface-alt);
    }

    /* Vista Individual de Proyecto */
    .detail-panel {
      margin-top: 28px;
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 28px;
      background: var(--surface-alt);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 22px;
    }

    .detail-meta-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .detail-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .sub-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .sub-box h4 {
      font-size: 1rem;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    .sub-box p {
      font-size: 0.92rem;
      color: var(--muted);
    }

    .sub-box p + p {
      margin-top: 6px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .kpi-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .kpi-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .kpi-txt {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .timeline-flow {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .timeline-step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight:
