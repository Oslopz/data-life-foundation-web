<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundación Data Life</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #0284c7;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Encabezado */
    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: var(--primary-dark);
      text-decoration: none;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 500;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--primary);
    }

    /* Secciones */
    section {
      padding: 48px 0;
    }

    .card-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
    }

    /* Hero */
    .hero {
      padding-top: 44px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 2.9rem);
      line-height: 1.15;
      margin-bottom: 18px;
      color: var(--text);
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 72ch;
      margin-bottom: 28px;
    }

    .actions-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.98rem;
      text-decoration: none;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
    }

    .btn-secondary {
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .section-title {
      font-size: 1.7rem;
      margin-bottom: 10px;
      color: var(--text);
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 26px;
      max-width: 68ch;
    }

    /* Cómo funciona */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .step-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }

    .step-num {
      display: inline-flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    .step-card h3 {
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .step-card p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    /* Trazabilidad */
    .trace-box {
      border-left: 4px solid var(--primary);
      padding-left: 20px;
    }

    .trace-box p + p {
      margin-top: 10px;
      color: var(--muted);
    }

    /* Indicadores */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .metric-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 6px;
    }

    .metric-label {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .metric-desc {
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* Proyectos destacados */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .project-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
    }

    .project-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background-color: #e2e8f0;
    }

    .project-body {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .project-body h3 {
      font-size: 1.1rem;
    }

    .project-link {
      color: var(--primary-dark);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .project-link:hover {
      text-decoration: underline;
    }

    /* Dashboards */
    .dashboard-embed {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 36px 24px;
      text-align: center;
      background: var(--surface-alt);
    }

    .bars-preview {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      height: 110px;
      margin-bottom: 18px;
    }

    .bars-preview span {
      width: 34px
